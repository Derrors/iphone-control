name: Feature request / 功能建议
description: Suggest an improvement. 英文或中文都可以。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do / 想做什么
      description: The task or workflow, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / 建议的做法
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的其他办法
