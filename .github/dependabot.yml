# Dependencies are pinned to exact versions on purpose (docs/decisions.md D9): every upgrade arrives as its
# own pull request and has to pass CI; device-facing ones (idevice, rmcp, tokio) also need a real-phone test.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # git dependency pinned to an upstream commit until the next release (docs/decisions.md D1)
      - dependency-name: idevice
      # 和 vendor 的 plume_core / apple-codesign 共用同一份 rsa 0.9，避免 Cargo.lock 出现两套 rsa 及 RustCrypto 依赖
      - dependency-name: rsa
        versions: [">= 0.10.0"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [rmcp, tokio, quick-xml]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 这个 action 的版本号就是 Rust 工具链版本：@1.99.1 是开发/CI 用的版本，@1.89.0 是 MSRV（rust-version），
      # 都是有意固定的，手动升级
      - dependency-name: dtolnay/rust-toolchain
