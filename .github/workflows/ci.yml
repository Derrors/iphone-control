name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一个 PR 推了新提交，就取消旧提交还没跑完的那次：macOS runner 少，旧运行会占着队列，
# 后面的排到超时被取消。main 上的每次推送都跑完
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR 只改了文档（Markdown、docs/、website/）时不跑 macOS 编译
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!website/**'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Viewer interaction tests
        run: node --test tests/viewer/*.test.mjs
      # 回归清单里点名的测试都还在（改名、删掉后清单会指向不存在的测试）
      - name: Regression cases name existing tests
        run: python3 tests/check_regression_cases.py
      # 真机脚本的解析和断言也需离线验证，无需连接设备或安装 MCP SDK。
      - name: Device test helper unit tests
        run: python3 -m unittest discover -s tests/device -p 'test_*.py'
      # 锁定工具链（与发布一致）：新版 clippy 的 lint 不会在代码没变时把 CI 弄挂
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # vendor/ 是上游代码，不格式化；只检查本仓库的包
      - name: fmt
        run: for p in ictl-ax ictl-ui ictl-l10n ictl-webinspector ictl-device ictl-wda ictl-sign ictl-unlock ictl-daemon ictl-mcp ictl-protocol iphone-control; do cargo fmt -p $p -- --check; done
      # --all-features：默认不编的 debug-cmds（调试子命令）也要能编译
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # rustdoc 断链与公开项引用私有项检查：两条互补（默认查 private_intra_doc_links，--document-private-items 补查私有注释里的断链）
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --all-features --locked
          cargo doc --workspace --no-deps --all-features --locked --document-private-items
      # check_fish_candidates 的候选词断言需要真正的 fish；缺了它该段会被静默跳过
      - name: Install fish for completion tests
        run: sudo apt-get update && sudo apt-get install -y fish
      - run: cargo test --workspace --all-features --locked
      - name: Terminal menus (PTY)
        run: python3 tests/terminal.py --binary target/debug/iphone-control --test-dir target/debug/deps

  # macOS（Apple Silicon）上能编译、测试通过；格式和平台无关，上面已经查过。Intel Mac 的发布包在同一台机器上交叉编译，
  # 这里也查一遍 x86_64 能编译（只 check，不链接、不跑测试）
  macos:
    needs: [changes]
    # changes 在 main 的推送上会跳过，这时照样跑
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # --all-features：默认不编的 debug-cmds（调试子命令）也要能编译
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked --target x86_64-apple-darwin -- -D warnings

  # macOS 上的终端菜单 PTY 回归。不在规则集的必过检查里：它靠两个进程之间的时间差模拟按键，
  # 忙的 macOS runner 上调度一卡就会误报（Linux 上同一个脚本在上面的 rust 里，仍是卡点）。
  # 结果照样显示在 PR 上，失败时看日志判断是不是真问题
  macos-terminal:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: terminal
      # 只要 iphone-control 和它的测试程序（pty_menu 在里面）
      - run: cargo build -p iphone-control --all-features --locked
      - run: cargo test -p iphone-control --all-features --locked --no-run
      - name: Terminal menus (PTY)
        run: python3 tests/terminal.py --binary target/debug/iphone-control --test-dir target/debug/deps

  # 安装方式能用：deb 打得出、装得上；用临时签名发行包校验 install.sh；Homebrew formula 能生成
  packages:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    # 和发布的二进制同一个系统（glibc 2.35）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: packages
      - run: cargo build --release --locked -p iphone-control
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-about@0.9.3
      # 第三方许可证清单（deb 里要带）：依赖里出现白名单（packaging/licenses/about.toml）以外的许可证时失败
      - run: cargo about generate --locked -m apps/iphone-control/Cargo.toml -c packaging/licenses/about.toml packaging/licenses/about.hbs -o THIRD_PARTY_LICENSES.html
      - name: Debian package installs
        run: |
          cargo deb -p iphone-control --no-build --output dist/iphone-control.deb
          sudo apt-get update
          sudo apt-get install -y ./dist/iphone-control.deb
          dpkg -s iphone-control | grep -E '^(Version|Depends):'
          dpkg -L iphone-control
          test -x /usr/sbin/usbmuxd
          test -f /usr/lib/systemd/user/iphone-control.service
          grep -q '^ExecStart=/usr/bin/iphone-control daemon$' /usr/lib/systemd/user/iphone-control.service
          iphone-control --version
          sudo apt-get remove -y iphone-control
      - name: install.sh
        run: |
          shellcheck -s sh install.sh
          python3 packaging/test_installer.py
      - name: Homebrew formula
        run: |
          shellcheck -s sh packaging/homebrew/formula.sh
          ICTL_UPDATE_PUBLISHER="$GITHUB_REPOSITORY" sh packaging/homebrew/formula.sh v0.0.0 aaa bbb ccc ddd > iphone-control.rb
          grep -F "https://github.com/$GITHUB_REPOSITORY/releases/" iphone-control.rb
          ruby -c iphone-control.rb

  # Cargo.toml 声明的最低版本（rust-version）要真能编译
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
