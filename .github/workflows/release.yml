name: Release

# 推送 v* tag 时：多架构镜像推到 ghcr（各架构在原生 runner 上构建，不用 QEMU 模拟），
# 附 SBOM 和构建来源证明；Linux 二进制和 sha256 附在 GitHub Release 上，发布说明取自 CHANGELOG.md 和 CHANGELOG.zh-CN.md。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/derrors/iphone-control

jobs:
  # 从源码运行（不用 Docker）的用户直接下载。在 Ubuntu 22.04 上编译（glibc 2.35），
  # 所以 Debian 12、Ubuntu 22.04 及更新的发行版都能运行
  binaries:
    strategy:
      matrix:
        include:
          # 文件名用 linux-<arch>（arch 与 uname -m 一致），不用 Rust 的 target 名（x86_64-unknown-linux-gnu）
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked -p iphone-control
      - name: Package
        run: |
          name="iphone-control-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/iphone-control LICENSE THIRD_PARTY.md README.md README.zh-CN.md CHANGELOG.md CHANGELOG.zh-CN.md "dist/$name/"
          cp -r deploy "dist/$name/"
          cp .env.example "dist/$name/env.example"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Platform name
        run: echo "PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 按 digest 推送，最后一步再合成一个多架构清单打标签
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PAIR }}
          sbom: true
          provenance: mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error

  publish-image:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 → 1.2.3、1.2、latest（预发布版本如 v1.2.3-rc.1 只打自己的版本号，不动 latest）
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

  release:
    needs: [binaries, publish-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      # 英文、中文各一节，末尾一行镜像和下载说明。两个文件都要有这个版本的一节，缺了就失败
      - name: Release notes from CHANGELOG.md and CHANGELOG.zh-CN.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            # 「## [1.2.3]」到下一个「## [」之间，去掉链接定义行和首尾空行
            awk -v v="$version" '
              /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
              found && !/^\[[^]]+\]: / { print }
            ' "$1" | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}'
          }
          en=$(section CHANGELOG.md)
          zh=$(section CHANGELOG.zh-CN.md)
          for f in en zh; do
            if [ -z "${!f}" ]; then
              echo "更新日志（$f）里没有 ## [$version] 一节" >&2
              exit 1
            fi
          done
          {
            echo "## English"; echo; echo "$en"; echo
            echo "## 中文"; echo; echo "$zh"; echo
            echo "---"; echo
            echo "**Docker:** \`${IMAGE}:${version}\` (linux/amd64, linux/arm64)"; echo
            echo "**Binaries / 二进制:** \`linux-x86_64\`, \`linux-aarch64\` (glibc 2.34+)"
          } > notes.md
      - name: Create release
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
