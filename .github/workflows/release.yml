name: Release

# 推送 v* tag 时：Linux（x86_64、aarch64）和 macOS（Apple Silicon）的压缩包、Linux 的 .deb 及 sha256 附在 GitHub Release 上，
# 发布说明取自 CHANGELOG.md 和 CHANGELOG.zh-CN.md；稳定版按发布者配置签名并可选更新 tap。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  ICTL_UPDATE_PUBLISHER: ${{ vars.ICTL_UPDATE_PUBLISHER }}
  ICTL_UPDATE_PUBLIC_KEYS: ${{ vars.ICTL_UPDATE_PUBLIC_KEYS }}
  ICTL_UPDATE_TAP: ${{ vars.ICTL_UPDATE_TAP }}

jobs:
  provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 packaging/release.py validate

  # install.sh、Homebrew、deb 都用这里的包。在 Ubuntu 22.04 上编译（glibc 2.35），
  # 所以 Debian 12、Ubuntu 22.04 及更新的发行版都能运行
  binaries:
    needs: provenance
    strategy:
      matrix:
        include:
          # 文件名用 linux-<arch>（arch 与 uname -m 一致），不用 Rust 的 target 名（x86_64-unknown-linux-gnu）
          # debarch: the architecture name in the .deb (Debian's names)
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            debarch: amd64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
            debarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked -p iphone-control
      # 第三方 Rust 组件许可证清单（cargo-about，按 Cargo.lock 生成）；白名单（packaging/licenses/about.toml）以外的许可证让发布失败
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: cargo about generate --locked -m apps/iphone-control/Cargo.toml -c packaging/licenses/about.toml packaging/licenses/about.hbs -o THIRD_PARTY_LICENSES.html
      - name: Package
        run: |
          name="iphone-control-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp target/release/iphone-control LICENSE THIRD_PARTY.md README.md README.zh-CN.md CHANGELOG.md CHANGELOG.zh-CN.md "dist/$name/"
          cp packaging/env.example "dist/$name/env.example"
          cp THIRD_PARTY_LICENSES.html "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      # Debian/Ubuntu package (metadata in apps/iphone-control/Cargo.toml): the binary, a systemd user service,
      # depends on usbmuxd. `sudo apt install ./iphone-control_<version>_<arch>.deb`
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Debian package
        run: |
          deb="iphone-control_${GITHUB_REF_NAME#v}_${{ matrix.debarch }}.deb"
          cargo deb -p iphone-control --no-build --output "dist/$deb"
          (cd dist && sha256sum "$deb" > "$deb.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}
          path: |
            dist/*.tar.gz*
            dist/*.deb*
          if-no-files-found: error

  release:
    needs: [binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      # 英文、中文各一节，末尾一行镜像和下载说明。两个文件都要有这个版本的一节，缺了就失败
      - name: Release notes from CHANGELOG.md and CHANGELOG.zh-CN.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          section() {
            # 「## [1.2.3]」到下一个「## [」之间，去掉链接定义行和首尾空行
            awk -v v="$version" '
              /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
              found && !/^\[[^]]+\]: / { print }
            ' "$1" | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}'
          }
          en=$(section CHANGELOG.md)
          zh=$(section CHANGELOG.zh-CN.md)
          for f in en zh; do
            if [ -z "${!f}" ]; then
              echo "更新日志（$f）里没有 ## [$version] 一节" >&2
              exit 1
            fi
          done
          {
            echo "## English"; echo; echo "$en"; echo
            echo "## 中文"; echo; echo "$zh"; echo
            echo "---"; echo
            echo "**Binaries / 二进制:** \`linux-x86_64\`, \`linux-aarch64\` (glibc 2.34+), \`macos-arm64\` (macOS 11+, Apple Silicon); \`.deb\` amd64, arm64 (Debian 12+, Ubuntu 22.04+)"; echo
            echo "**Debian/Ubuntu:** \`sudo apt install ./iphone-control_${version}_amd64.deb\` (or \`_arm64.deb\`)"
            if [[ "$GITHUB_REF_NAME" != *-* ]]; then
              echo "**Installer:** \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh | sh\` (once the signed assets for your platform are available)"
              if [[ -n "$ICTL_UPDATE_TAP" ]]; then echo "**Homebrew:** \`brew install $ICTL_UPDATE_TAP/iphone-control\`"; fi
            fi
          } > notes.md
      - name: Create release
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

  # macOS（Apple Silicon）二进制，Release 建好后再传上去：GitHub 的 macOS runner 经常排队，
  # 排不上时（15 分钟后被取消）不拖住镜像和 Linux 二进制，重跑这个任务就能补上。
  # 文件名里的 arm64 与 Mac 上 uname -m 一致。没有公证（要付费开发者账号）：链接器自带 ad-hoc 签名能直接运行，
  # 用终端 curl 下载不带隔离标记；浏览器下载的要去掉 com.apple.quarantine（见 macOS 指南）
  macos-binary:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-aarch64-apple-darwin
      - run: cargo build --release --locked -p iphone-control
      # 第三方 Rust 组件许可证清单（cargo-about，按 Cargo.lock 生成）；白名单（packaging/licenses/about.toml）以外的许可证让发布失败
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - run: cargo about generate --locked -m apps/iphone-control/Cargo.toml -c packaging/licenses/about.toml packaging/licenses/about.hbs -o THIRD_PARTY_LICENSES.html
      - name: Check
        run: |
          file target/release/iphone-control
          codesign --verify --verbose target/release/iphone-control
          target/release/iphone-control --version
      # 不带 deploy/（systemd 服务文件，Mac 上用不到）
      - name: Package
        run: |
          name="iphone-control-${GITHUB_REF_NAME}-macos-arm64"
          mkdir -p "dist/$name"
          cp target/release/iphone-control LICENSE THIRD_PARTY.md README.md README.zh-CN.md CHANGELOG.md CHANGELOG.zh-CN.md "dist/$name/"
          cp packaging/env.example "dist/$name/env.example"
          cp THIRD_PARTY_LICENSES.html "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: macos-archive
          path: dist/*.tar.gz*
          if-no-files-found: error

  # Retrying a partial release upload reuses the exact build bytes (including tar mtimes).
  upload-macos:
    needs: macos-binary
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macos-archive
          path: dist
      - name: Upload to the release
        run: python3 packaging/release.py upload dist/*.tar.gz dist/*.tar.gz.sha256
        env:
          GH_TOKEN: ${{ github.token }}

  # Sign the archived bytes that users can already download. Linux signing does
  # not depend on the macOS build. The private key is restricted to this environment.
  sign-linux:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: built
          merge-multiple: true
      - name: Download Linux archives and generate the pinned installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern '*-linux-*.tar.gz' --dir dist
          for asset in dist/*.tar.gz; do cmp "built/${asset##*/}" "$asset"; done
          python3 packaging/release.py installer dist/install.sh
      - name: Sign Linux manifests
        env:
          ICTL_UPDATE_SIGNING_KEY: ${{ secrets.ICTL_UPDATE_SIGNING_KEY }}
          ICTL_UNATTENDED_TAG: ${{ vars.ICTL_UNATTENDED_TAG }}
          ICTL_ROLLBACK_COMPATIBLE_TAG: ${{ vars.ICTL_ROLLBACK_COMPATIBLE_TAG }}
          ICTL_ROLLBACK_FROM_VERSION: ${{ vars.ICTL_ROLLBACK_FROM_VERSION }}
        run: |
          python3 packaging/release.py sign dist linux-x86_64
          python3 packaging/release.py sign dist linux-aarch64
      - name: Publish signed Linux manifests and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/release.py upload dist/*.manifest.json* dist/install.sh

  sign-macos:
    needs: upload-macos
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download macOS archive
        uses: actions/download-artifact@v8
        with:
          name: macos-archive
          path: built
      - name: Compare published archive to build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern '*-macos-arm64.tar.gz' --dir dist
          archive="iphone-control-$GITHUB_REF_NAME-macos-arm64.tar.gz"
          cmp "built/$archive" "dist/$archive"
      - name: Sign macOS manifest
        env:
          ICTL_UPDATE_SIGNING_KEY: ${{ secrets.ICTL_UPDATE_SIGNING_KEY }}
          ICTL_UNATTENDED_TAG: ${{ vars.ICTL_UNATTENDED_TAG }}
          ICTL_ROLLBACK_COMPATIBLE_TAG: ${{ vars.ICTL_ROLLBACK_COMPATIBLE_TAG }}
          ICTL_ROLLBACK_FROM_VERSION: ${{ vars.ICTL_ROLLBACK_FROM_VERSION }}
        run: python3 packaging/release.py sign dist macos-arm64
      - name: Publish signed macOS manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/release.py upload dist/*.manifest.json*

  # The configured tap is updated only after every supported target was signed.
  homebrew:
    needs: [sign-linux, sign-macos]
    if: ${{ !contains(github.ref_name, '-') && vars.ICTL_UPDATE_TAP != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Formula
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern '*.manifest.json*' --dir signed
          mac=$(python3 packaging/release.py sha signed macos-arm64)
          x86=$(python3 packaging/release.py sha signed linux-x86_64)
          arm=$(python3 packaging/release.py sha signed linux-aarch64)
          sh packaging/homebrew/formula.sh "$GITHUB_REF_NAME" "$mac" "$x86" "$arm" > iphone-control.rb
          ruby -c iphone-control.rb
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Push to configured Homebrew tap
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone "git@github.com:${ICTL_UPDATE_TAP%/*}/homebrew-${ICTL_UPDATE_TAP#*/}.git" tap
          mkdir -p tap/Formula && cp iphone-control.rb tap/Formula/iphone-control.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/iphone-control.rb
          git diff --cached --quiet || { git commit -m "iphone-control ${GITHUB_REF_NAME#v}" && git push; }
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
