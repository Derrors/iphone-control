[package]
name = "iphone-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
description = "iphone-control 命令行入口"

[dependencies]
ictl-l10n.workspace = true
ictl-daemon.workspace = true
ictl-device.workspace = true
ictl-mcp.workspace = true
ictl-sign.workspace = true
ictl-wda = { workspace = true, optional = true }
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
rustls.workspace = true
serde_json.workspace = true
uuid.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# `iphone-control debug …` 真机诊断子命令（直接调设备层和 WDA，不经守护进程），开发时用，默认不编进去：
#   cargo build --features debug-cmds
debug-cmds = ["dep:ictl-wda"]

# `cargo deb -p iphone-control` (release workflow): the Debian/Ubuntu package
[package.metadata.deb]
name = "iphone-control"
maintainer = "Derrors <33656531+Derrors@users.noreply.github.com>"
copyright = "Derrors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Lets an AI agent operate a real iPhone or iPad over USB: a long-running daemon owns the phone (tunnel, \
WebDriverAgent, HID) and exposes it to Claude Code or any MCP client, plus a control page in the browser that \
hands tasks to a local Claude Code or Codex. Runs as a systemd user service; see /usr/share/doc/iphone-control."""
section = "utils"
priority = "optional"
depends = "$auto, usbmuxd"
# the control page's picture as H.264 (about 1/15 of MJPEG's traffic); without it the page uses MJPEG
recommends = "ffmpeg"
maintainer-scripts = "../../deploy/deb"
assets = [
  ["target/release/iphone-control", "usr/bin/", "755"],
  ["../../deploy/deb/iphone-control.service", "usr/lib/systemd/user/", "644"],
  ["../../packaging/env.example", "usr/share/doc/iphone-control/env.example", "644"],
  ["../../THIRD_PARTY_LICENSES.html", "usr/share/doc/iphone-control/", "644"],
  ["../../README.md", "usr/share/doc/iphone-control/", "644"],
  ["../../README.zh-CN.md", "usr/share/doc/iphone-control/", "644"],
  ["../../THIRD_PARTY.md", "usr/share/doc/iphone-control/", "644"],
]
