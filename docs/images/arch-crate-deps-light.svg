<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="iphone-control 12 个 workspace crate 与 vendor 层的单向分层依赖关系：入口层 apps 与 ictl-mcp，核心层 ictl-daemon，协议与基础层 ictl-protocol/ictl-ui/ictl-l10n，能力引擎层，以及底层设备与第三方库">
  <title>Workspace Crate 分层依赖架构</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#59636e"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d4a72c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h1 { font-size: 22px; font-weight: 700; }
      .h2 { font-size: 20px; font-weight: 700; }
      .h3 { font-size: 16px; font-weight: 700; }
      .sub { font-size: 13px; fill: #59636e; }
      .label { font-size: 13px; fill: #59636e; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .frame { font-size: 15px; fill: #59636e; }
    </style>
  </defs>
  <text x="28" y="38" class="h1">Workspace 12 个 Crate 分层与依赖关系</text>
  <text x="28" y="62" class="sub">清晰的单向依赖边界：ictl-mcp 仅依赖协议与本地化层，彻底隔离设备实现；vendor/ 上游代码独立于 workspace</text>
  <rect x="20" y="88" width="120" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="80" y="139.0" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#59636e">表现与入口层</text>
  <rect x="20" y="198" width="120" height="96" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="80" y="251.0" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#59636e">守护进程核心</text>
  <rect x="20" y="312" width="120" height="84" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="80" y="359.0" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#59636e">协议与通用域</text>
  <rect x="20" y="414" width="120" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="80" y="462.0" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#59636e">设备能力引擎</text>
  <rect x="20" y="518" width="120" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="80" y="566.0" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#59636e">传输与第三方</text>
  <rect x="160" y="88" width="660" height="92" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="176" y="116" style="font-size:15px;font-weight:700;fill:#0e7490">apps/iphone-control（单一可执行二进制）</text>
  <text x="176" y="140" style="font-size:12px;fill:#59636e">CLI 入口（clap）· 首次引导 · service · update 自更新 · task / remote 跨机命令</text>
  <text x="176" y="160" style="font-size:12px;fill:#59636e">viewer/（hyper HTTP/1.1 · TLS · 令牌 · SSE）· video/（hub · vt/ · ffmpeg · transcode）· web/（构建期拼装）</text>
  <rect x="840" y="88" width="340" height="92" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="856" y="116" style="font-size:15px;font-weight:700;fill:#6d28d9">ictl-mcp（MCP 服务端）</text>
  <text x="856" y="140" style="font-size:12px;fill:#59636e">18 核心工具 + 6 开发者工具 + iphone_confirm</text>
  <text x="856" y="160" style="font-size:12px;fill:#59636e">stdio &amp; HTTP /mcp 共用（rmcp），不碰设备层</text>
  <rect x="160" y="198" width="790" height="96" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="176" y="226" style="font-size:15px;font-weight:700;fill:#0e7490">ictl-daemon（常驻守护进程核心）</text>
  <rect x="862" y="207" width="74" height="24" rx="12.0" fill="#0e7490"/>
  <text x="899.0" y="223.32" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#ffffff">独占设备</text>
  <text x="176" y="252" style="font-size:12px;fill:#59636e">core/{persist,dispatch} · supervise/{native,wda,resign} · watch（usbmuxd Listen）· watchdog（run-state）</text>
  <text x="176" y="272" style="font-size:12px;fill:#59636e">tools/{native/*,input/*,observe,keys,launch,scroll} · tasks/{task,scope,store} · screen · mjpeg · doctor · notify</text>
  <rect x="160" y="312" width="340" height="84" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="174" y="338" style="font-size:14px;font-weight:700;fill:#1d4ed8">ictl-protocol</text>
  <text x="174" y="360" style="font-size:12px;fill:#59636e">request / response / client / paths / env</text>
  <text x="174" y="378" style="font-size:12px;fill:#59636e">Unix Socket 协议 · 环境变量总表与文档对账</text>
  <rect x="520" y="312" width="320" height="84" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="534" y="338" style="font-size:14px;font-weight:700;fill:#1d4ed8">ictl-ui</text>
  <text x="534" y="360" style="font-size:12px;fill:#59636e">统一元素树（Source / Tree）与几何遮挡</text>
  <text x="534" y="378" style="font-size:12px;fill:#59636e">屏幕尺寸与四向旋转（Native / WDA 共用）</text>
  <rect x="860" y="312" width="320" height="84" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="874" y="338" style="font-size:14px;font-weight:700;fill:#15803d">ictl-l10n（最底层零内部依赖）</text>
  <text x="874" y="360" style="font-size:12px;fill:#59636e">中英双语宏 tr!/trf!/log_tr! 与延迟渲染 Text</text>
  <text x="874" y="378" style="font-size:12px;fill:#59636e">除 ictl-ax / ictl-webinspector 外全员共享</text>
  <rect x="160" y="414" width="194" height="86" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="174" y="440" style="font-size:14px;font-weight:700;fill:#1f2328">ictl-ax</text>
  <text x="174" y="463" style="font-size:12px;fill:#59636e">iOS 27 remoteAX</text>
  <text x="174" y="481" style="font-size:12px;fill:#59636e">DTX 走树 → Source</text>
  <rect x="366" y="414" width="194" height="86" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="440" style="font-size:14px;font-weight:700;fill:#1f2328">ictl-wda</text>
  <text x="380" y="463" style="font-size:12px;fill:#59636e">后台 WDA 启动/接管</text>
  <text x="380" y="481" style="font-size:12px;fill:#59636e">WDA HTTP 客户端</text>
  <rect x="572" y="414" width="194" height="86" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="586" y="440" style="font-size:14px;font-weight:700;fill:#1f2328">ictl-unlock</text>
  <text x="586" y="463" style="font-size:12px;fill:#59636e">安全逐位自动解锁</text>
  <text x="586" y="481" style="font-size:12px;fill:#59636e">Screen Trait 抽象</text>
  <rect x="778" y="414" width="194" height="86" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="792" y="440" style="font-size:14px;font-weight:700;fill:#1f2328">ictl-sign</text>
  <text x="792" y="463" style="font-size:12px;fill:#59636e">Apple ID / 签名自检</text>
  <text x="792" y="481" style="font-size:12px;fill:#59636e">Anisette 瞬断重试</text>
  <rect x="984" y="414" width="196" height="86" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="998" y="440" style="font-size:14px;font-weight:700;fill:#1f2328">ictl-webinspector</text>
  <text x="998" y="463" style="font-size:12px;fill:#59636e">Web Inspector 协议</text>
  <text x="998" y="481" style="font-size:12px;fill:#59636e">Safari/WebView JS</text>
  <rect x="160" y="518" width="606" height="86" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="174" y="544" style="font-size:14px;font-weight:700;fill:#0e7490">ictl-device（设备通信与传输层）</text>
  <text x="174" y="567" style="font-size:12px;fill:#59636e">usbmuxd（列表 + Listen 监听）· Lockdown · CoreDeviceProxy 隧道（idevice + jktcp）</text>
  <text x="174" y="585" style="font-size:12px;fill:#59636e">HID · 截图 · DDI 缓存与挂载 · HEVC 屏幕媒体流 · AppService · os_trace 日志 · 崩溃报告</text>
  <rect x="778" y="518" width="402" height="86" rx="14" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="792" y="544" style="font-size:14px;font-weight:700;fill:#9a6700">vendor/（独立于 workspace）</text>
  <text x="792" y="567" style="font-size:12px;fill:#59636e">plume_core / plume_store · omnisette (超时/去 panic 补丁)</text>
  <text x="792" y="585" style="font-size:12px;fill:#59636e">apple-codesign (0o755 补丁) · 保留各自 MPL-2.0 / MIT 许可</text>
  <line x1="490" y1="180" x2="490" y2="196" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="134" x2="838" y2="134" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <path d="M1010 180 L 1010 310" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
  <path d="M980 180 L 980 302 L 380 302 L 380 310" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
  <text x="1094" y="248" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#6d28d9">ictl-mcp 仅依赖</text>
  <text x="1094" y="266" class="label" text-anchor="middle" style="font-size:11px;fill:#6d28d9">protocol + l10n</text>
  <line x1="300" y1="294" x2="300" y2="310" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="294" x2="680" y2="310" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="572" y1="457" x2="562" y2="457" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="463" y1="500" x2="463" y2="516" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="257" y1="500" x2="257" y2="516" stroke="#59636e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="875" y1="500" x2="875" y2="516" stroke="#d4a72c" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <path d="M1082 500 L 1082 509 L 730 509 L 730 516" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>
