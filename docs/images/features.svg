<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 593" width="1200" height="593" role="img" aria-label="Device control · core — Native on iOS 27+: No WDA, no Apple ID, no signing; ready in seconds. iOS 17–26: WDA.; 17 MCP tools: Screenshots, taps, swipes, text input, buttons, apps, URLs, element tree.; Fewer round trips: Actions return the settled screen; iphone_batch runs 20 steps per call.; Runs unattended: Recovers from replugs and reboots, with or without the control page.; A person in charge: Pause, take over or stop any time; asks before paying, deleting, sending.; doctor and alerts: Checks every layer from USB up; Telegram or Bark when it needs you.. Access — On this machine: Claude Code, Codex, any MCP client over stdio; task run for any agent.; Remotely: HTTP MCP on the control page's port, HTTPS and login, read-only tokens.. Control page · optional — Control page: A live picture to tap and drag on; hand out AI tasks, take over any time..">
  <defs>
    <linearGradient id="cd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="cd-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="190" height="30" rx="15" fill="url(#cd-icon)"/>
  <text x="16" y="20" font-size="15" font-weight="700" fill="#ffffff">Device control · core</text>
  <g transform="translate(0 44)">
