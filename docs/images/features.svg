    <text x="88" y="54" font-size="22" font-weight="700" fill="#f0f9ff">Native on iOS 27+</text>
    <text x="24" y="104" font-size="15" fill="#94a3b8">No WDA, no Apple ID, no signing;</text>
    <text x="24" y="128" font-size="15" fill="#94a3b8">ready in seconds. iOS 17–26: WDA.</text>
  </g>
