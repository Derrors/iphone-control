<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 388" width="1200" height="388" role="img" aria-label="One binary: Linux or macOS. No Xcode, no paid developer account, no jailbreak.; 15 MCP tools: Screenshots, taps, swipes, text input, buttons, apps, URLs, element tree.; Fewer round trips: Actions return the settled screen; iphone_batch runs 20 steps per call.; Runs unattended: Recovers from replugs and reboots; re-signs WDA before it expires.; HID fallback: Screenshots, taps and keys keep working via CoreDevice (iOS 27+).; doctor and alerts: Checks every layer from USB to WDA; Telegram or Bark when it needs you.">
