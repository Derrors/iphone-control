<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 593" width="1200" height="593" role="img" aria-label="设备控制 · 核心 — iOS 27 原生控制: 不装 WDA、不用 Apple ID 和签名 几秒就绪；iOS 17–26 用 WDA; 18 个 MCP 工具: 截图、点击、滑动、输入中文 按键、管理 App、读元素树; 少走往返: 操作后顺带返回稳定后的界面 iphone_batch 一次最多 20 步; 无人值守: 拔插、重启、断连后自动恢复 不开控制台也一直提供服务; 人工把关: 随时暂停、接管、停止任务 付款、删除、发送前先问你; 诊断与通知: doctor 从 USB 起逐层检查 需要你时发 Telegram 或 Bark. 接入 — 本机接入: Claude Code、Codex 等 MCP 客户端 经 stdio；task run 接任意 agent; 远程接入: 控制台同一端口提供 HTTP MCP HTTPS、登录令牌，可以只读. 控制台 · 可选 — 控制台: 实时画面，鼠标直接点按、拖动 下达 AI 任务，随时接管.">
