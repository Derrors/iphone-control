    <text x="24" y="104" font-size="22" font-weight="700" fill="#f0f9ff">15 个 MCP 工具</text>
    <text x="24" y="132" font-size="15" fill="#94a3b8">截图、点击、滑动、输入中文</text>
    <text x="24" y="155" font-size="15" fill="#94a3b8">按键、管理 App、读元素树</text>
  </g>
  <g transform="translate(824 0)">
    <rect x="0.5" y="0.5" width="375" height="175" rx="18" fill="url(#cd-bg)" stroke="#155e75" stroke-opacity="0.7"/>
    <rect x="24" y="24" width="48" height="48" rx="12" fill="url(#cd-icon)"/>
