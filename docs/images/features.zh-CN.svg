    <text x="24" y="132" font-size="15" fill="#94a3b8">操作后顺带返回稳定后的界面</text>
    <text x="24" y="155" font-size="15" fill="#94a3b8">iphone_batch 一次最多 20 步</text>
  </g>
  <g transform="translate(0 212)">
    <rect x="0.5" y="0.5" width="375" height="175" rx="18" fill="url(#cd-bg)" stroke="#155e75" stroke-opacity="0.7"/>
