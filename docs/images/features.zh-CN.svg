<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 388" width="1200" height="388" role="img" aria-label="一个二进制: Linux 或 macOS 上直接运行 不需要 Xcode、付费账号，不越狱; 15 个 MCP 工具: 截图、点击、滑动、输入中文 按键、管理 App、读元素树; 少走往返: 操作后顺带返回稳定后的界面 iphone_batch 一次最多 20 步; 无人值守: 拔插、重启、WDA 崩溃后自动恢复 描述文件到期前自动重签; HID 后备: WDA 不可用时截图、点击、按键 改走 CoreDevice（iOS 27+）; 诊断与通知: doctor 从 USB 到 WDA 逐层检查 需要你时发 Telegram 或 Bark">
  <defs>
    <linearGradient id="cd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="cd-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Helvetica, Arial, sans-serif">
  <g transform="translate(0 0)">
    <rect x="0.5" y="0.5" width="375" height="175" rx="18" fill="url(#cd-bg)" stroke="#155e75" stroke-opacity="0.7"/>
    <rect x="24" y="24" width="48" height="48" rx="12" fill="url(#cd-icon)"/>
    <g transform="translate(24 24)"><polyline points="14,17 22,24 14,31" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="25" y1="32" x2="35" y2="32" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>
    <text x="24" y="104" font-size="22" font-weight="700" fill="#f0f9ff">一个二进制</text>
    <text x="24" y="132" font-size="15" fill="#94a3b8">Linux 或 macOS 上直接运行</text>
    <text x="24" y="155" font-size="15" fill="#94a3b8">不需要 Xcode、付费账号，不越狱</text>
  </g>
  <g transform="translate(412 0)">
    <rect x="0.5" y="0.5" width="375" height="175" rx="18" fill="url(#cd-bg)" stroke="#155e75" stroke-opacity="0.7"/>
    <rect x="24" y="24" width="48" height="48" rx="12" fill="url(#cd-icon)"/>
