    <g transform="translate(24 24)"><path d="M35 24 A11 11 0 1 1 31.8 16.2" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><polyline points="33,9 33,17 25,17" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="24" y="104" font-size="22" font-weight="700" fill="#f0f9ff">无人值守</text>
    <text x="24" y="132" font-size="15" fill="#94a3b8">拔插、重启、WDA 崩溃后自动恢复</text>
    <text x="24" y="155" font-size="15" fill="#94a3b8">描述文件到期前自动重签</text>
  </g>
  <g transform="translate(412 212)">
    <rect x="0.5" y="0.5" width="375" height="175" rx="18" fill="url(#cd-bg)" stroke="#155e75" stroke-opacity="0.7"/>
    <rect x="24" y="24" width="48" height="48" rx="12" fill="url(#cd-icon)"/>
    <g transform="translate(24 24)"><path d="M24 11 L37 18 L24 25 L11 18 Z" fill="#fff"/><polyline points="11,24 24,31 37,24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="11,30 24,37 37,30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/></g>
    <text x="24" y="104" font-size="22" font-weight="700" fill="#f0f9ff">HID 后备</text>
    <text x="24" y="132" font-size="15" fill="#94a3b8">WDA 不可用时截图、点击、按键</text>
    <text x="24" y="155" font-size="15" fill="#94a3b8">改走 CoreDevice（iOS 27+）</text>
  </g>
  <g transform="translate(824 212)">
    <rect x="0.5" y="0.5" width="375" height="175" rx="18" fill="url(#cd-bg)" stroke="#155e75" stroke-opacity="0.7"/>
    <rect x="24" y="24" width="48" height="48" rx="12" fill="url(#cd-icon)"/>
    <g transform="translate(24 24)"><polyline points="9,25 17,25 21,14 27,34 31,25 39,25" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="24" y="104" font-size="22" font-weight="700" fill="#f0f9ff">诊断与通知</text>
    <text x="24" y="132" font-size="15" fill="#94a3b8">doctor 从 USB 到 WDA 逐层检查</text>
    <text x="24" y="155" font-size="15" fill="#94a3b8">需要你时发 Telegram 或 Bark</text>
  </g>
