# cargo-about：生成随发布包附带的第三方 Rust 组件许可证清单 THIRD_PARTY_LICENSES.html（压缩包里，deb 是
# /usr/share/doc/iphone-control/THIRD_PARTY_LICENSES.html）。依赖里出现不在这个列表里的许可证时 CI 和发布失败，需要人看一眼再决定（例如 AGPL、没有许可证声明的 crate）
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0",
    "Unicode-3.0", "Zlib", "CC0-1.0", "0BSD", "BSL-1.0", "Unlicense", "CDLA-Permissive-2.0", "BlueOak-1.0.0",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
