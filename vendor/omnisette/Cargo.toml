# vendored from Impactor v2.7.2 (b13d995)。本仓库的改动（见 THIRD_PARTY.md）：workspace 继承改成显式版本；
# reqwest 用 rustls-no-provider；本地 anisette（加载苹果 Android 库，依赖没有许可证的 android-loader）改成可选 feature local-anisette
[package]
name = "omnisette"
edition = "2024"
version = "2.7.2"
authors = ["khcrysalis"]
license = "MPL-2.0"
repository = "https://github.com/claration/impactor"

[features]
remote-anisette = []
async = ["dep:async-trait"]
default = ["remote-anisette", "local-anisette", "dep:remove-async-await"]
# 本地 anisette：加载苹果的 libstoreservicescore.so（需自备），依赖 android-loader（没有许可证声明）
local-anisette = ["dep:android-loader"]
remote-anisette-v3 = [
    "async",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:chrono",
]
aos-kit = []

[dependencies]
sha2 = "0.11"
base64 = "0.22"
rand = "0.8"
plist = "1.8"
thiserror = "2.0"

hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = [ "blocking", "json", "rustls-no-provider", "gzip", "system-proxy", ] }
uuid = { version = "1.3", features = ["v4", "fast-rng", "macro-diagnostics"] }
android-loader = { git = "https://github.com/Dadoum/android-loader", branch = "bigger_pages", optional = true }
libc = "0.2"
log = "0.4"
async-trait = { version = "0.1", optional = true }
remove-async-await = { version = "1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio-tungstenite = { version = "0.27.0", optional = true, features = [
    "rustls-tls-webpki-roots",
] }
futures-util = { version = "0.3.28", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"], optional = true }
anyhow = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
dlopen2 = "0.4"
objc = "0.2"
objc-foundation = "0.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread"] }
simplelog = "0.12"
