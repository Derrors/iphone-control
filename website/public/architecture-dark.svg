<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="iphone-control architecture: AI clients use iphone-control mcp over stdio, and the optional control page (iphone-control viewer) serves browsers and remote agents over HTTPS; both talk to the daemon over a Unix socket. The daemon is the core: it owns the iPhone or iPad over USB, natively on iOS 27 and later and through WebDriverAgent on iOS 17 to 26, and keeps running with the control page closed">
  <title>iphone-control architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9198a1"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d4a72c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f87171"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/>
    </marker>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .h1 { font-size: 22px; font-weight: 700; }
      .h2 { font-size: 20px; font-weight: 700; }
      .h3 { font-size: 16px; font-weight: 700; }
      .sub { font-size: 13px; fill: #9198a1; }
      .label { font-size: 13px; fill: #9198a1; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .frame { font-size: 15px; fill: #9198a1; }
    </style>
  </defs>
  <rect x="16" y="16" width="900" height="628" rx="24" fill="none" stroke="#3d444d" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="44" y="54" class="frame"><tspan style="font-weight:700;fill:#e6edf3">Linux or macOS host</tspan>  ·  launchd, systemd user service or a terminal</text>
  <rect x="48" y="88" width="260" height="112" rx="16" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
  <text x="72" y="130" style="font-size:19px;font-weight:700;fill:#e6edf3">AI client</text>
  <text x="72" y="160" style="font-size:15px;fill:#9198a1">Claude Code · Codex ·</text>
  <text x="72" y="182" style="font-size:15px;fill:#9198a1">any MCP client</text>
  <line x1="178" y1="202" x2="178" y2="258" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="194" y="236" class="label" style="font-size:14px">MCP · stdio</text>
  <rect x="48" y="262" width="260" height="112" rx="16" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
  <text x="72" y="304" style="font-size:18px;font-weight:700;fill:#e6edf3">iphone-control mcp</text>
  <text x="72" y="334" style="font-size:15px;fill:#9198a1">one per agent session,</text>
  <text x="72" y="356" style="font-size:15px;fill:#9198a1">a thin client</text>
  <line x1="310" y1="318" x2="388" y2="318" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="349" y="302" class="label" text-anchor="middle" style="font-size:14px">Unix</text>
  <text x="349" y="344" class="label" text-anchor="middle" style="font-size:14px">socket</text>
  <rect x="48" y="420" width="260" height="156" rx="16" fill="#151b23" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="462" style="font-size:19px;font-weight:700">Control page</text>
  <rect x="210" y="442" width="82" height="26" rx="13.0" fill="#3d444d"/>
  <text x="251.0" y="459.68" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#e6edf3">optional</text>
  <text x="72" y="492" class="label" style="font-size:14px">iphone-control viewer</text>
  <text x="72" y="522" style="font-size:14px;fill:#9198a1">live picture · AI tasks</text>
  <text x="72" y="546" style="font-size:14px;fill:#9198a1">HTTP MCP at /mcp</text>
  <line x1="310" y1="498" x2="388" y2="498" stroke="#9198a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="349" y="482" class="label" text-anchor="middle" style="font-size:14px">Unix</text>
  <text x="349" y="524" class="label" text-anchor="middle" style="font-size:14px">socket</text>
  <line x1="178" y1="632" x2="178" y2="580" stroke="#9198a1" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="194" y="616" style="font-size:14px;fill:#9198a1">browsers, remote agents · HTTPS, login</text>
  <rect x="392" y="88" width="496" height="512" rx="20" fill="#0b2a33" stroke="#22d3ee" stroke-width="2"/>
  <text x="420" y="130" style="font-size:24px;font-weight:700;fill:#22d3ee">iphone-control daemon</text>
  <text x="420" y="160" style="font-size:15px;fill:#9198a1">the core: owns the phone, runs with the page closed</text>
  <rect x="420" y="186" width="440" height="116" rx="14" fill="#0d1117" stroke="#155e75" stroke-width="1.5"/>
  <text x="444" y="226" style="font-size:18px;font-weight:700;fill:#e6edf3">Native control</text>
  <rect x="710" y="207" width="136" height="24" rx="12.0" fill="#0e7490"/>
  <text x="778.0" y="223.32" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#ffffff">iOS 27+ · default</text>
  <text x="444" y="258" style="font-size:14px;fill:#9198a1">accessibility service · HID · CoreDevice</text>
  <text x="444" y="282" style="font-size:14px;fill:#9198a1">nothing installed, no Apple ID</text>
  <rect x="420" y="322" width="440" height="116" rx="14" fill="#0d1117" stroke="#155e75" stroke-width="1.5"/>
  <text x="444" y="362" style="font-size:18px;font-weight:700;fill:#e6edf3">WebDriverAgent</text>
  <rect x="748" y="343" width="98" height="24" rx="12.0" fill="#3d444d"/>
  <text x="797.0" y="359.32" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#e6edf3">iOS 17–26</text>
  <text x="444" y="394" style="font-size:14px;fill:#9198a1">runs on the phone, signed with a free Apple ID</text>
  <text x="444" y="418" style="font-size:14px;fill:#9198a1">re-signed before the 7-day profile expires</text>
  <rect x="420" y="458" width="440" height="116" rx="14" fill="#0d1117" stroke="#155e75" stroke-width="1.5"/>
  <text x="444" y="498" style="font-size:18px;font-weight:700;fill:#e6edf3">Tasks and supervisor</text>
  <text x="444" y="530" style="font-size:14px;fill:#9198a1">pause · take over · confirm before risky steps</text>
  <text x="444" y="554" style="font-size:14px;fill:#9198a1">hotplug wake · disk image · unlock · notify</text>
  <line x1="890" y1="300" x2="984" y2="300" stroke="#9198a1" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="937" y="284" class="label" text-anchor="middle" style="font-size:14px">USB</text>
  <text x="937" y="324" class="label" text-anchor="middle" style="font-size:14px">usbmuxd</text>
  <rect x="990" y="88" width="180" height="360" rx="36" fill="#0d1117"/>
  <rect x="1002" y="100" width="156" height="336" rx="26" fill="url(#screen)"/>
  <rect x="1050" y="112" width="60" height="16" rx="8" fill="#0b1220"/>
  <text x="1080" y="206" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#ffffff">iPhone / iPad</text>
  <text x="1080" y="232" text-anchor="middle" style="font-size:15px;fill:#d5f3fb">iOS 17+</text>
  <rect x="1012" y="268" width="136" height="64" rx="12" fill="#ffffff" fill-opacity="0.15"/>
  <text x="1080" y="296" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#ffffff">iOS 27+</text>
  <text x="1080" y="318" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#ffffff">nothing to install</text>
  <text x="1080" y="392" text-anchor="middle" style="font-size:13px;fill:#c4ecf7">iOS 17–26:</text>
  <text x="1080" y="412" text-anchor="middle" style="font-size:13px;fill:#c4ecf7">WebDriverAgent</text>
  <path d="M862 516 C 904 516, 920 546, 944 546" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="948" y="496" width="236" height="104" rx="16" fill="#2b2111" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="968" y="530" style="font-size:16px;font-weight:700;fill:#e6edf3">Outbound HTTPS</text>
  <text x="968" y="558" style="font-size:14px;fill:#9198a1">Apple ID (WDA) · DDI</text>
  <text x="968" y="580" style="font-size:14px;fill:#9198a1">Bark · Telegram alerts</text>
</svg>
