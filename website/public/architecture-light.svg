<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="iphone-control architecture: an MCP client talks to iphone-control mcp over stdio, which talks to the daemon over a Unix socket; the daemon drives the iPhone or iPad over USB through WebDriverAgent, with CoreDevice HID as fallback">
  <title>iphone-control architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#59636e"/>
    </marker>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h2 { font-size: 24px; font-weight: 700; }
      .h3 { font-size: 19px; font-weight: 600; }
      .sub { font-size: 15px; fill: #59636e; }
      .label { font-size: 15px; fill: #59636e; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .pill { font-size: 14px; font-weight: 600; }
      .frame { font-size: 16px; fill: #59636e; }
    </style>
  </defs>

  <!-- Linux host -->
  <rect x="16" y="16" width="900" height="568" rx="24" fill="none" stroke="#d0d7de" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="44" y="54" class="frame"><tspan style="font-weight:700;fill:#1f2328">Linux or macOS host</tspan>  ·  launchd, systemd user service or a terminal</text>

  <!-- AI client -->
  <rect x="48" y="88" width="260" height="128" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="72" y="134" class="h3">AI client</text>
  <text x="72" y="166" class="sub">Claude Code · Cursor ·</text>
  <text x="72" y="190" class="sub">any MCP client</text>

  <line x1="178" y1="218" x2="178" y2="300" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="194" y="265" class="label">MCP · stdio</text>

  <!-- MCP server -->
  <rect x="48" y="304" width="260" height="128" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="72" y="350" class="h3">iphone-control mcp</text>
  <text x="72" y="382" class="sub">one per agent session,</text>
  <text x="72" y="406" class="sub">a thin client</text>

  <line x1="310" y1="368" x2="388" y2="368" stroke="#59636e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="349" y="350" class="label" text-anchor="middle">Unix</text>
  <text x="349" y="396" class="label" text-anchor="middle">socket</text>

  <text x="48" y="500" class="sub">Nothing listens on the network.</text>
  <text x="48" y="526" class="sub">WebDriverAgent is reached through usbmuxd.</text>

  <!-- daemon -->
  <rect x="392" y="88" width="496" height="468" rx="20" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="420" y="130" class="h2" style="fill:#0e7490">iphone-control daemon</text>
  <text x="420" y="160" class="sub">one long-running process owns the phone</text>
  <rect x="420" y="186" width="440" height="100" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="444" y="228" class="h3">WebDriverAgent client</text>
  <rect x="752" y="206" width="88" height="30" rx="15" fill="#0e7490"/>
  <text x="796" y="227" class="pill" style="fill:#ffffff" text-anchor="middle">primary</text>
  <text x="444" y="260" class="sub">element tree · tap · type · screenshot</text>
  <rect x="420" y="306" width="440" height="100" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="444" y="348" class="h3">CoreDevice HID</text>
  <rect x="752" y="326" width="88" height="30" rx="15" fill="#fbbf24"/>
  <text x="796" y="347" class="pill" style="fill:#1f2328" text-anchor="middle">fallback</text>
  <text x="444" y="380" class="sub">tap · swipe · keys · screenshot while WDA is down</text>
  <rect x="420" y="426" width="440" height="100" rx="14" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="444" y="468" class="h3">Supervisor</text>
  <text x="444" y="500" class="sub">usbmuxd · reconnect · disk image · re-sign · notify</text>

  <!-- USB link -->
  <line x1="890" y1="270" x2="984" y2="270" stroke="#59636e" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="937" y="256" class="label" text-anchor="middle">USB</text>
  <text x="937" y="296" class="label" text-anchor="middle">usbmuxd</text>

  <!-- iPhone -->
  <rect x="990" y="72" width="180" height="350" rx="36" fill="#1f2328"/>
  <rect x="1002" y="84" width="156" height="326" rx="26" fill="url(#screen)"/>
  <rect x="1050" y="96" width="60" height="16" rx="8" fill="#0b1220"/>
  <text x="1080" y="196" text-anchor="middle" style="fill:#ffffff;font-size:20px;font-weight:700">iPhone / iPad</text>
  <text x="1080" y="222" text-anchor="middle" style="fill:#ffffff;font-size:15px;opacity:.8">iOS 17+</text>
  <rect x="1018" y="262" width="124" height="64" rx="12" fill="#ffffff" fill-opacity="0.14"/>
  <text x="1080" y="290" text-anchor="middle" style="fill:#ffffff;font-size:15px;font-weight:600">WebDriver</text>
  <text x="1080" y="312" text-anchor="middle" style="fill:#ffffff;font-size:15px;font-weight:600">Agent</text>
  <text x="1080" y="378" text-anchor="middle" style="fill:#ffffff;font-size:13px;opacity:.8">signed with a</text>
  <text x="1080" y="396" text-anchor="middle" style="fill:#ffffff;font-size:13px;opacity:.8">free Apple ID</text>

  <!-- outbound internet -->
  <path d="M862 476 C 904 476, 920 506, 944 506" fill="none" stroke="#59636e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="948" y="456" width="236" height="100" rx="16" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="970" y="490" class="h3" style="font-size:17px">Outbound HTTPS</text>
  <text x="970" y="516" class="sub">Apple ID · anisette</text>
  <text x="970" y="538" class="sub">Bark · Telegram</text>
</svg>
