<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Auto-unlock safety flow: checks this device's disabled record and post-reboot BFU first, loads per-UDID passcode, writes the device's record before digit 2, verifies each digit count, clears the record only on verified unlock, and disables this device with notification on any failure">
  <title>Auto-unlock safety guardrail flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#59636e"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d4a72c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h1 { font-size: 22px; font-weight: 700; }
      .h2 { font-size: 20px; font-weight: 700; }
      .h3 { font-size: 16px; font-weight: 700; }
      .sub { font-size: 13px; fill: #59636e; }
      .label { font-size: 13px; fill: #59636e; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .frame { font-size: 15px; fill: #59636e; }
    </style>
  </defs>
  <text x="28" y="38" class="h1">Auto-Unlock Safety Guardrails: Fail-Closed by Design</text>
  <text x="28" y="62" class="sub">Off by default; both Native and WDA share ictl-unlock guardrails so a wrong passcode or crash never retries</text>
  <rect x="24" y="92" width="252" height="152" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="38" y="120" style="font-size:14px;font-weight:700;fill:#1f2328">1. Pre-Flight Gates</text>
  <text x="38" y="148" style="font-size:12px;fill:#59636e">• Check this device's disabled record</text>
  <text x="38" y="169" style="font-size:12px;fill:#59636e">• Reject post-reboot BFU</text>
  <text x="38" y="190" style="font-size:12px;fill:#59636e">• Load secrets/passcodes/&lt;UDID&gt;</text>
  <text x="38" y="211" style="font-size:12px;fill:#59636e">  (never shared across devices)</text>
  <line x1="276" y1="168" x2="304" y2="168" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-brand)"/>
  <rect x="306" y="92" width="268" height="152" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="320" y="120" style="font-size:14px;font-weight:700;fill:#0e7490">2. Wake &amp; Enter Digit 1</text>
  <text x="320" y="148" style="font-size:12px;fill:#59636e">• Native closes HID to read lock UI</text>
  <text x="320" y="169" style="font-size:12px;fill:#59636e">• Taps “Use Passcode” if Touch ID</text>
  <text x="320" y="190" style="font-size:12px;fill:#59636e">• Enters digit 1 &amp; checks count = 1</text>
  <text x="320" y="211" style="font-size:12px;fill:#59636e">• Retries ≤3× only if digit 1 missed</text>
  <line x1="574" y1="168" x2="602" y2="168" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-brand)"/>
  <rect x="604" y="92" width="278" height="152" rx="12" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="618" y="120" style="font-size:14px;font-weight:700;fill:#9a6700">3. Write Marker → Verify All</text>
  <text x="618" y="148" style="font-size:12px;fill:#59636e">★ Write the device's record before #2</text>
  <text x="618" y="169" style="font-size:12px;fill:#59636e">• Crash / kill stays disabled safely</text>
  <text x="618" y="190" style="font-size:12px;fill:#59636e">• Verify digit count after each tap</text>
  <text x="618" y="211" style="font-size:12px;fill:#59636e">• Mismatch stops immediately</text>
  <line x1="882" y1="168" x2="910" y2="168" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-brand)"/>
  <rect x="912" y="92" width="264" height="152" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="926" y="120" style="font-size:14px;font-weight:700;fill:#15803d">4. Verify Unlocked</text>
  <text x="926" y="148" style="font-size:12px;fill:#59636e">• Confirmed unlocked:</text>
  <text x="926" y="169" style="font-size:12px;fill:#59636e">  ✓ Remove the device's record</text>
  <text x="926" y="190" style="font-size:12px;fill:#59636e">  ✓ Wait 0.7s unlock animation</text>
  <text x="926" y="211" style="font-size:12px;fill:#59636e">  ✓ Proceed with MCP action</text>
  <line x1="150" y1="244" x2="150" y2="294" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="160" y="275" style="font-size:11px;font-weight:600;fill:#b91c1c">Marker / BFU</text>
  <line x1="743" y1="244" x2="743" y2="294" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="754" y="275" style="font-size:11px;font-weight:600;fill:#b91c1c">Mid-entry crash / error</text>
  <line x1="1044" y1="244" x2="1044" y2="294" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="1054" y="275" style="font-size:11px;font-weight:600;fill:#b91c1c">Still locked</text>
  <rect x="24" y="298" width="1152" height="118" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="44" y="328" style="font-size:15px;font-weight:700;fill:#b91c1c">Fail-Closed Lockout (This Device Only)</text>
  <text x="44" y="356" style="font-size:13px;fill:#1f2328">• Keeps the device's record and sends Bark / Telegram alert; never retries a potentially wrong passcode</text>
  <text x="44" y="382" style="font-size:13px;fill:#59636e">• Recovery: unlock the phone manually → run iphone-control passcode set if changed → explicitly run iphone-control unlock-reset</text>
  <text x="44" y="405" style="font-size:11px;fill:#59636e">Note: Turn off Settings → StandBy when using auto-unlock (StandBy hides the passcode keypad while charging sideways).</text>
</svg>
