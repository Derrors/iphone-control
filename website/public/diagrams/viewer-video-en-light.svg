<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Video encoding decision tree: iOS 27+ prefers the phone&#x27;s hardware HEVC (transcoded to H.264 via ffmpeg up to 4 streams if browser lacks HEVC); iOS 17-26 uses native VideoToolbox on macOS or hardware/x264 ffmpeg on Linux, falling back to deduplicated MJPEG">
  <title>Control page video codec selection and fallback</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#59636e"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d4a72c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', 'WenQuanYi Zen Hei', Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h1 { font-size: 22px; font-weight: 700; }
      .h2 { font-size: 20px; font-weight: 700; }
      .h3 { font-size: 16px; font-weight: 700; }
      .sub { font-size: 13px; fill: #59636e; }
      .label { font-size: 13px; fill: #59636e; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .frame { font-size: 15px; fill: #59636e; }
    </style>
  </defs>
  <text x="28" y="38" class="h1">Control Page Video: Automatic Selection &amp; Fallback</text>
  <text x="28" y="62" class="sub">Default IPHONE_CONTROL_VIEWER_CODEC=auto picks the lowest-latency, lowest-bandwidth path and falls back cleanly</text>
  <rect x="24" y="198" width="194" height="108" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="121" y="236" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0e7490">Phone &amp; Setting</text>
  <text x="121" y="262" text-anchor="middle" style="font-size:12px;fill:#59636e">iOS 27+ &amp; device</text>
  <text x="121" y="282" text-anchor="middle" style="font-size:12px;fill:#59636e">video allowed?</text>
  <path d="M218 228 L 268 228 L 268 158 L 306 158" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-brand)"/>
  <text x="244" y="148" style="font-size:12px;font-weight:700;fill:#0e7490">Yes</text>
  <path d="M218 276 L 268 276 L 268 358 L 306 358" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="240" y="382" style="font-size:12px;font-weight:700;fill:#59636e">No</text>
  <rect x="308" y="114" width="210" height="88" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="413" y="148" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#0e7490">Browser decodes</text>
  <text x="413" y="170" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#0e7490">WebCodecs HEVC?</text>
  <text x="413" y="190" text-anchor="middle" style="font-size:11px;fill:#59636e">macOS Chrome / Safari</text>
  <path d="M518 140 L 598 140" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <text x="558" y="132" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#15803d">Yes</text>
  <path d="M518 178 L 558 178 L 558 232 L 598 232" fill="none" stroke="#0891b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-brand)"/>
  <text x="558" y="250" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#0e7490">No</text>
  <rect x="600" y="92" width="574" height="88" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="616" y="120" style="font-size:14px;font-weight:700;fill:#15803d">1. HEVC iPhone (Direct Hardware Stream)</text>
  <rect x="1086" y="101" width="74" height="24" rx="12.0" fill="#16a34a"/>
  <text x="1123.0" y="117.32" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#ffffff">Best</text>
  <text x="616" y="144" style="font-size:12px;fill:#59636e">• ~60 fps native resolution, zero host encoding CPU, ~150–600 KB/s scrolling</text>
  <text x="616" y="164" style="font-size:12px;fill:#59636e">• Low-bandwidth mode: lowers phone cap 6 → 2 Mbit/s (shared across viewers on that phone)</text>
  <rect x="600" y="192" width="574" height="86" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="616" y="220" style="font-size:14px;font-weight:700;fill:#0e7490">2. HEVC → H.264 Transcode (Firefox / Linux Chrome)</text>
  <text x="616" y="244" style="font-size:12px;fill:#59636e">• Host ffmpeg transcodes HEVC to H.264 (up to 4 concurrent streams; 503 retries above cap)</text>
  <text x="616" y="264" style="font-size:12px;fill:#59636e">• Pauses input when behind and requests a fresh keyframe; low-bandwidth raises QP to 26</text>
  <rect x="308" y="312" width="210" height="92" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="413" y="344" text-anchor="middle" style="font-size:13px;font-weight:700">WDA 9100 MJPEG</text>
  <text x="413" y="366" text-anchor="middle" style="font-size:12px;fill:#59636e">Host encoder +</text>
  <text x="413" y="386" text-anchor="middle" style="font-size:12px;fill:#59636e">browser WebCodecs?</text>
  <path d="M518 338 L 598 338" fill="none" stroke="#0891b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-brand)"/>
  <text x="558" y="330" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#0e7490">Yes</text>
  <path d="M518 378 L 558 378 L 558 424 L 598 424" fill="none" stroke="#d4a72c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
  <text x="558" y="442" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#9a6700">Fallback</text>
  <rect x="600" y="290" width="574" height="88" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="616" y="318" style="font-size:14px;font-weight:700;fill:#1f2328">3. Host H.264 (macOS Native VideoToolbox / Linux ffmpeg)</text>
  <text x="616" y="342" style="font-size:12px;fill:#59636e">• ~1/15 the traffic of MJPEG (near zero still, 300–450 KB/s scrolling); 1 shared WDA upstream</text>
  <text x="616" y="362" style="font-size:12px;fill:#59636e">• Linux order: NVENC → VAAPI → QSV → V4L2 → x264; low-bandwidth raises per-page QP 20→26</text>
  <rect x="600" y="390" width="574" height="72" rx="12" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="616" y="416" style="font-size:14px;font-weight:700;fill:#9a6700">4. MJPEG Fallback (/stream · No ffmpeg or Legacy Browser)</text>
  <text x="616" y="440" style="font-size:12px;fill:#59636e">• Still drops duplicate still frames and sends latest only; 4–10 MB/s scrolling (install ffmpeg on Linux)</text>
  <rect x="24" y="478" width="1150" height="44" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="599" y="505" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#59636e">All video paths share 100 ms end-to-end acks (POST /api/video/ack): slow links drop frame rate instead of lagging behind · Active codec shown under the picture</text>
</svg>
