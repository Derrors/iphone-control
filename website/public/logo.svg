<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="iphone-control logo">
  <title>iphone-control</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#083344" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app-icon tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="148" y="64" width="216" height="384" rx="48" fill="#ffffff"/>
  </g>
  <rect x="166" y="82" width="180" height="348" rx="32" fill="url(#screen)"/>
  <rect x="226" y="98" width="60" height="18" rx="9" fill="#0b1220"/>

  <!-- AI sparkle on the screen -->
  <path d="M256 168 C263 214 278 229 324 236 C278 243 263 258 256 304 C249 258 234 243 188 236 C234 229 249 214 256 168 Z" fill="#ffffff"/>
  <path d="M310 150 C312 164 316 168 330 170 C316 172 312 176 310 190 C308 176 304 172 290 170 C304 168 308 164 310 150 Z" fill="#67e8f9"/>

  <!-- home indicator -->
  <rect x="226" y="404" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.55"/>

  <!-- tap: amber ripple with a pointer -->
  <circle cx="366" cy="372" r="74" fill="#fbbf24" stroke="#ffffff" stroke-width="14"/>
  <path d="M346 330 L346 410 L366 390 L382 424 L398 416 L382 384 L410 382 Z" fill="#0b1220" stroke="#0b1220" stroke-width="6" stroke-linejoin="round"/>
</svg>
